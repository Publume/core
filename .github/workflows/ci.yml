name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Check out Publume Themes
        uses: actions/checkout@v7
        with:
          repository: Publume/themes
          path: .contract/themes
      - name: Verify the real theme contract
        env:
          PUBLUME_THEME_DIRECTORY: ${{ github.workspace }}/.contract/themes
        run: bun run acceptance
